<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Call and Response</title>
<meta name="description" content="Two spider monkeys share a forest. Move four sliders and see how much they eat. SCUDEM XI 2026, Problem B.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
<link rel="stylesheet" href="./styles.css">
<script type="importmap">
{ "imports": {
    "pixi.js":      "https://cdn.jsdelivr.net/npm/pixi.js@8.14.0/dist/pixi.min.mjs",
    "pixi-filters": "https://cdn.jsdelivr.net/npm/pixi-filters@6.1.5/dist/pixi-filters.min.mjs",
    "katex":        "https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.mjs"
} }
</script>
</head>
<body>
<div id="arena"></div>
<div class="name">Call and Response</div>
<button class="info" id="btn-info" aria-label="The equations">i</button>
<div class="gfx-note" id="gfx-note" hidden>simplified graphics</div>

<div class="hud" id="hud" hidden>
  <div class="clock"><span id="r-clock">6 am</span><div class="day"><div id="r-day"></div></div></div>
  <div class="total"><b id="r-total">0.0</b> <span class="unit">trees eaten</span> <span class="delta" id="r-delta"></span></div>
  <div class="bars">
    <div class="row"><span class="who a">A</span><div class="track"><div class="fill a" id="b-a"></div><div class="mark" id="m-a"></div></div><span class="num" id="n-a"></span></div>
    <div class="row"><span class="who b">B</span><div class="track"><div class="fill b" id="b-b"></div><div class="mark" id="m-b"></div></div><span class="num" id="n-b"></span></div>
  </div>
  <div class="loners"><i></i>two loners: <span id="r-loners"></span></div>
</div>

<div class="panel">
  <div class="sliders">
    <label class="s"><span class="lab">Distance apart</span><span class="val" id="v-d"></span><input type="range" id="s-d" min="0" max="320" step="1" value="186"></label>
    <label class="s"><span class="lab">Accuracy</span><span class="val" id="v-p"></span><input type="range" id="s-p" min="0" max="100" step="1" value="100"></label>
    <label class="s"><span class="lab">Detail</span><span class="val" id="v-b"></span><input type="range" id="s-b" min="0" max="100" step="1" value="100"></label>
    <label class="s"><span class="lab">B lies</span><span class="val" id="v-z"></span><input type="range" id="s-z" min="0" max="100" step="1" value="0"></label>
  </div>
  <button class="go" id="btn-go">Go</button>
</div>

<div class="modal" id="card" hidden><div class="card"><button class="x" id="card-close" aria-label="Close">×</button><div id="card-body"></div></div></div>
<script type="module" src="./main.js"></script>
</body>
</html>
